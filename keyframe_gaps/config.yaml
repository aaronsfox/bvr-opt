# Keyframe gaps (Analysis 3 in the plan doc): perfect (bead-based reference) keyframes at increasing spacing.
#
# Every condition shares the same bookend keyframes, `bookend` frames in from each end of the trial
# (frame 5 and frame N - 6). Between them, keyframes fall every `spacing` frames from the first bookend.
# If the last regular keyframe would leave a final gap shorter than half the spacing, it is dropped so that
# gap merges with the one before. `full` uses the two bookends only (one gap over the whole trial).
# Scored frames: every non-keyframe strictly between the bookends.

data_root: datasets/Welte2022/data/SOL001A
trials: [T0014_hop108_0001, T0014_hop108_0002, T0019_jog0001, T000AssessmentTrial]
bones: [tib, tal, cal]
bookend: 5
spacings: [5, 10, 20, 30, 40, full]

# Where keyframe poses come from: `reference` = the bead-based poses (a perfect rater). Analysis 2 will add
# simulated raters.
keyframes: reference

# Welte 2022 operator standard: frames worse than this would need correcting by hand
correction_threshold: {pivot_mm: 1.0, rot_deg: 2.0}

arms:
  # The new method, with the methods-comparison settings. The basis size K and the frames sampled per
  # iteration scale with gap length (per 10 frames: K = 3, batch = 4, as in the methods comparison), so each
  # frame gets the same flexibility and the same amount of image data whatever the spacing.
  new_opt:          {kind: anchored, cofit: true, w_drr: 1.0, w_f2f: 2.0, lam: 0.003, mu: 0.01, d_min: -2.0,
                     K_per_10: 3, batch_per_10: 4, res: [256, 512], iters: [40, 50], lrs: [0.3, 0.1]}
  # new_opt with a stepwise start: from each keyframe, step frame by frame into the gap (each frame starts
  # from a constant-velocity prediction and is fitted alone, linked to the previous frame by the
  # frame-to-frame term); the forward and backward chains are blended by distance, and the result replaces
  # the spline as the starting path for the same anchored refinement as new_opt.
  new_opt_stepwise: {kind: stepwise, cofit: true, w_drr: 1.0, w_f2f: 2.0, lam: 0.003, mu: 0.01, d_min: -2.0,
                     K_per_10: 3, batch_per_10: 4, res: [256, 512], iters: [40, 50], lrs: [0.3, 0.1],
                     step_res: [256, 512], step_iters: [20, 20], step_lrs: [0.2, 0.05]}
  # new_opt_stepwise preceded by keyframe correction: each given keyframe k is first re-fitted to the images
  # of frames k - window .. k + window (bones co-fitted, DRR + frame-to-frame + collision), moving at most
  # `tol` (mm, deg) from where it was given. Only the corrected keyframes are kept; they then replace the
  # given keyframes, held fixed, in the stepwise chains and the anchored refinement.
  new_opt_stepwise_kc: {kind: stepwise, cofit: true, w_drr: 1.0, w_f2f: 2.0, lam: 0.003, mu: 0.01, d_min: -2.0,
                        K_per_10: 3, batch_per_10: 4, res: [256, 512], iters: [40, 50], lrs: [0.3, 0.1],
                        step_res: [256, 512], step_iters: [20, 20], step_lrs: [0.2, 0.05],
                        keyframe_correction: {tol: [1.0, 2.0], window: 2, key_w: 0.01, res: [256, 512],
                                              iters: [40, 50], lrs: [0.3, 0.1]}}
  # Reference: spline interpolation through the same keyframes (CPU, seconds)
  keyframe_interp:  {kind: interp, interp: spline}
