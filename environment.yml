# Conda environment for bvr-opt
#
# Create:   conda env create -f environment.yml
# Update:   conda env update -f environment.yml --prune
# Activate: conda activate bvr_opt
#
# PyTorch is installed from pip using the CPU-only build (smaller, and what the
# CPU array jobs on the cluster need). For a GPU environment, remove the
# --extra-index-url line below and install the CUDA build that matches the
# cluster's driver instead, e.g. --index-url https://download.pytorch.org/whl/cu126

name: bvr_opt
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip

  # Numerics and analysis
  - numpy>=2.0
  - scipy>=1.13
  - pandas>=2.2

  # Images and volumes (TIFF reading/writing, incl. LZW/zlib compression)
  - tifffile>=2024.8
  - imagecodecs>=2024.6
  - scikit-image>=0.24
  - pillow>=10.0

  # Figures
  - matplotlib>=3.9

  # Job configs and notebooks
  - pyyaml>=6.0
  - ipykernel

  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch>=2.4
